name: Update POM Versions

on:
  workflow_dispatch:

jobs:
  update-pom-version:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Debugging Step - List files
      run: |
        echo "Listing all files in the repository:"
        find .

    - name: Debugging Step - Check Java version
      run: |
        echo "Checking Java version:"
        java -version

    - name: Debugging Step - Print POM files
      run: |
        echo "Listing all POM files:"
        find . -name "pom.xml" -exec ls -l {} \;

    - name: Debugging Step - Print sed command output
      run: |
        echo "Testing sed command on a sample POM file:"
        SAMPLE_POM=$(find . -name "pom.xml" | head -n 1)
        echo "Sample POM file: $SAMPLE_POM"
        sed -E 's/(<version>[0-9]+\.[0-9]+)\.([0-9]+)(-SNAPSHOT<\/version>)/echo \1.$((\2 + 1))\3/e' "$SAMPLE_POM"

    - name: Debugging Step - Check git configuration
      run: |
        echo "Checking git configuration:"
        git config --list

    - name: Find and update POM versions for pdfl artifact
      run: |
        # Create a new branch
        BRANCH_NAME="update-pom-versions-$(date +%Y%m%d%H%M%S)"
        git checkout -b "$BRANCH_NAME"

        # Find and update <version> elements only for <artifactId>pdfl</artifactId> in pom.xml files
        find . -name "pom.xml" | while read -r POM_FILE; do
          awk '/<artifactId>pdfl<\/artifactId>/ {found=1} /<version>/ && found { \
            sub(/<version>[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT<\/version>/, \
            "<version>" gensub(/([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT/, "\\1.\\2." (\\3+1) "-SNAPSHOT", "g", "&") "</version>"); \
            found=0 \
          } 1' "$POM_FILE" > tmp && mv tmp "$POM_FILE"

          # Print the path of the modified POM file
          echo "Modified POM file: $POM_FILE"
        done

        # Commit the changes with the new version in the message
        git config user.name "datalogics-devauto"
        git config user.email "datalogics-devauto@datalogics.com"
        git add .
        git commit -m "Update minor version for pdfl artifact in all pom.xml files"

        # Push the branch to origin
        git push origin "$BRANCH_NAME"

    - name: Create a pull request
      uses: peter-evans/create-pull-request@v5
      with:
        branch: "$BRANCH_NAME"
        title: "Update minor version in all pom.xml files"
        body: "This pull request updates the minor version in all pom.xml files by incrementing it by one."
        labels: "automated-update"